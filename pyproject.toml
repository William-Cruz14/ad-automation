[project]
name = "ad-automation-python"
version = "0.1.0"
description = ""
authors = [
    {name = "William Cruz",email = "cruzwilliam14@gmail.com"}
]
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi (==0.136.3)",
    "uvicorn (==0.49.0)",
    "annotated-doc (==0.0.4)",
    "annotated-types (==0.7.0)",
    "anyio (==4.13.0)",
    "click (==8.4.1)",
    "colorama (==0.4.6)",
    "h11 (==0.16.0)",
    "idna (==3.18)",
    "pydantic[email] (>=2.13.4,<3.0.0)",
    "pydantic-core (==2.46.4)",
    "starlette (==1.2.1)",
    "typing-inspection (==0.4.2)",
    "typing-extensions (==4.15.0)",
    "ldap3 (>=2.9.1,<3.0.0)",
    "pycryptodome (>=3.23.0,<4.0.0)",
    "python-decouple (>=3.8,<4.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.0.51,<3.0.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "loguru (>=0.7.3,<0.8.0)"
]

[tool.fastapi]
entrypoint = "src.main:app"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"