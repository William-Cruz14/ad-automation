services:
  postgres:
    image: postgres:17-alpine
    container_name: ad-postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ad_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5


  ad-api:
    build: .
    container_name: ad-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"

    volumes:
      - ./certificate:/app/certs:ro

    networks:
      - ad_network

    depends_on:
      postgres:
        condition: service_healthy


networks:
  ad_network:
    driver: bridge


volumes:
  postgres_data: